<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | CartNova</title>
    <meta name="description" content="Login to your CartNova account">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <div class="auth-page">
        <div class="auth-container">
            <!-- Left: Brand Panel -->
            <div class="auth-brand">
                <a href="index.html" class="auth-brand-logo">
                    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="8" cy="21" r="1" />
                        <circle cx="19" cy="21" r="1" />
                        <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12" />
                    </svg>
                    <span>Cart<span style="color: rgba(255,255,255,0.8);">Nova</span></span>
                </a>
                <h2 class="auth-brand-title">Shop everything you love, all in one place.</h2>
                <p class="auth-brand-text">Join thousands of happy customers who trust CartNova for their everyday
                    shopping needs.</p>
            </div>

            <!-- Right: Login Form -->
            <div class="auth-form-wrapper">
                <form class="auth-form" id="loginForm" novalidate>
                    <h1 class="auth-title">Welcome Back</h1>
                    <p class="auth-subtitle">Login to your CartNova account</p>

                    <div id="loginError" class="form-error"
                        style="display:none; margin-bottom: 16px; padding: 12px; background: #FEE2E2; border-radius: 8px; text-align: center;">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginEmail">Email</label>
                        <input type="email" class="form-input" id="loginEmail" placeholder="Enter your email" required>
                        <span class="form-error"></span>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="loginPassword">Password</label>
                        <div class="password-wrapper">
                            <input type="password" class="form-input" id="loginPassword"
                                placeholder="Enter your password" required>
                            <button type="button" class="password-toggle" id="loginPasswordToggle"
                                aria-label="Toggle password visibility">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>
                        <span class="form-error"></span>
                    </div>

                    <div class="form-footer"
                        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                        <label class="form-check">
                            <input type="checkbox" class="form-check-input">
                            <span class="form-check-label">Remember Me</span>
                        </label>
                        <a href="#" class="forgot-link"
                            style="color: var(--primary); font-size: 0.875rem; text-decoration: none;">Forgot
                            Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>

                    <p class="auth-link" style="margin-top: 24px; text-align: center;">Don't have an account? <a
                            href="register.html" style="color: var(--primary);">Create Account</a></p>


                </form>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="js/products.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/wishlist.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
